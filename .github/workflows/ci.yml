# CI on every PR; deploys to GitHub Pages when main changes. PLAN.md §3 CI/CD, ADR-0002.
name: CI

# No PRs on this repo (PLAN §0 rule 5): every pushed branch is verified, and only main deploys.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads the pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm check:content
      - run: pnpm build
        env:
          # Public by design (ADR-0005); set as a repository variable, not a secret.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
      - run: pnpm check:budgets
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm cv:pdf
      - run: pnpm test:e2e
      # Lighthouse on the built site, served like GitHub Pages (PLAN §1 targets, lighthouserc.json).
      - run: node scripts/serve-out.mjs &
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          urls: |
            http://localhost:4173/noel-site/en/
            http://localhost:4173/noel-site/es/
            http://localhost:4173/noel-site/en/cv/
            http://localhost:4173/noel-site/en/projects/buddy/
            http://localhost:4173/noel-site/en/contact/
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
